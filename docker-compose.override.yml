version: '3.8'

services:
  # FastAPI Backend (Development overrides)
  fastapi:
    environment:
      - DEBUG=true
      - RELOAD=true
    volumes:
      - ./api:/app/api
      - ./utils:/app/utils
      - ./logs:/app/logs
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # MySQL (Development overrides)
  mysql:
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=catdi_db
      - MYSQL_USER=catdi_user
      - MYSQL_PASSWORD=catdi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
