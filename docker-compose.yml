version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: catdi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: catdi_db
      MYSQL_USER: catdi_user
      MYSQL_PASSWORD: catdi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-prootpassword", "-e", "SELECT 1;"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # FastAPI Backend
  fastapi:
    build: .
    container_name: catdi_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_USER=catdi_user
      - DB_PASS=catdi_password
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=catdi_db
      - DATABASE_URL=mysql+pymysql://catdi_user:catdi_password@mysql:3306/catdi_db
      - LOG_PATH=/app/logs
      - CATMH_APP_ID=your_catmh_app_id
      - CATMH_ORG_ID=your_catmh_org_id
    volumes:
      - ./logs:/app/logs
      - ./api:/app/api
      - ./utils:/app/utils
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local


