version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: checkin_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: checkin_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-prootpassword", "-e", "SELECT 1;"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # FastAPI Backend
  fastapi:
    build: .
    container_name: checkin_fastapi
    restart: unless-stopped
    ports:
      - "8090:8000"
    environment:
      - DB_USER=db_user
      - DB_PASS=db_password
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=checkin_db
      - DATABASE_URL=mysql+pymysql://db_user:db_password@mysql:3306/checkin_db
      - LOG_PATH=/app/logs
    volumes:
      - ./logs:/app/logs
      - ./api:/app/api
      - ./utils:/app/utils
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local


